<!doctype html>
<html lang="uk" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>Система Учёта (СКУД)</title>
    <meta name="description" content="Браузерная система учёта посещения сотрудников и работы пункта охраны." />
    <meta property="og:title" content="Система Учёта (СКУД)" />
    <meta property="og:description" content="Браузерная система учёта посещения сотрудников и работы пункта охраны." />
    <script>
      (function() {
        try {
          let theme = 'dark';
          let fontSize = 'medium';

          // Try loading preference of the currently active user
          const rawUser = localStorage.getItem('checkpoint_current_user');
          if (rawUser) {
            try {
              const u = JSON.parse(rawUser);
              if (u && u.id) {
                const userPref = localStorage.getItem('skud_pref_' + u.id);
                if (userPref) {
                  const p = JSON.parse(userPref);
                  if (p.theme) theme = p.theme;
                  if (p.fontSize) fontSize = p.fontSize;
                } else {
                  if (u.theme) theme = u.theme;
                  if (u.fontSize) fontSize = u.fontSize;
                }
              }
            } catch (e) {}
          } else {
            theme = localStorage.getItem('theme') || 'dark';
            fontSize = localStorage.getItem('fontSize') || 'medium';
          }

          const root = document.documentElement;
          root.classList.remove('dark');
          if (theme === 'dark') {
            root.classList.add('dark');
          }
          root.setAttribute('data-theme', theme);

          let size = '16px';
          if (fontSize === 'small') size = '14px';
          else if (fontSize === 'large') size = '18px';
          root.style.fontSize = size;
          root.setAttribute('data-font-size', fontSize);
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
